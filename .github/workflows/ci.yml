name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

      - name: Unit tests
        # The default marker filter excludes tests that download a model, so this
        # job stays fast and works offline. The eval job below covers those.
        run: pytest -v

  evaluate:
    name: Retrieval evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('ragbot/config.py') }}

      - name: Model-dependent tests
        run: pytest -m slow -v

      - name: Rebuild the sample corpus
        # Proves the committed PDFs still match the script that generates them.
        run: |
          python scripts/build_samples.py
          git diff --stat -- samples/

      - name: Run retrieval evaluation
        run: python eval/run_eval.py --write

      - name: Fail if retrieval has regressed
        # A quality gate, not decoration: if a change drops Recall@1 below the
        # agreed floor, the build breaks.
        run: python eval/check_thresholds.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: docs/EVALUATION.md

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ragbot:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name ragbot -p 8501:8501 ragbot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs ragbot; exit 1
