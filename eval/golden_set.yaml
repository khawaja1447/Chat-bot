# Golden set for retrieval evaluation.
#
# Each entry names the document and page(s) that actually contain the answer.
# `pages` is a list because a few facts legitimately appear twice in one document.
#
# Every question must have exactly one correct home in the corpus. The corpus
# contains a 2023 annual report that mirrors the 2024 one heading for heading, so
# any question about a figure MUST name its year — otherwise the label is
# ambiguous and the metric measures nothing. The same applies to policy facts
# that appear in both the handbook and the security policy.
#
# kinds:
#   lookup      wording overlaps the source; dense retrieval should find it easily
#   paraphrase  asks for the fact in words the document never uses
#   numeric     the answer is a figure among many nearby figures
#   distractor  a near-identical passage exists elsewhere in the corpus
#   temporal    right topic, wrong year is the trap
#
# Add cases when you find a failure. That is what the file is for.

